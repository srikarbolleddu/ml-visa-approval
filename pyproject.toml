[project]
name = "ml-visa-approval"
version = "0.1.0"
description = "US work-visa (PERM) outcome prediction: gradient boosting on public DOL data, served as a live demo API."
requires-python = ">=3.13,<3.14"
# Runtime (inference) dependencies only -- this is what ships in the Lambda image.
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "mangum>=0.19.0,<1.0.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.6,<1.10",
    "skops>=0.11,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0.0",
    "httpx>=0.27,<1.0.0",
    "ty>=0.0.25",
    "ruff>=0.9,<1.0.0",
    "coverage>=7.4.3,<8.0.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "uvicorn>=0.32",
]
# Training-only: never installed into the Lambda image.
train = [
    "matplotlib>=3.9",
    "imbalanced-learn>=0.13",
    "openpyxl>=3.1",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"training/*" = ["T201"]
"scripts/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
